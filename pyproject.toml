[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-research-observatory"
version = "0.1.0"
description = "Offline evidence ledger and provenance validation for OI research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-observe = "oif_observatory.ledger:main"

[tool.setuptools.packages.find]
where = ["src"]
